<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Qibla Direction</title>
  <meta name="description" content="Free, open source Qibla compass that points towards the Kaaba in Makkah.">
  <meta name="theme-color" content="#0f5132">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Qibla">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Qibla</h1>
      <p id="location" class="location">Finding your location&hellip;</p>
    </header>

    <section class="compass" aria-label="Qibla compass">
      <!-- Fixed marker: the direction the top of your phone is facing -->
      <div class="facing" aria-hidden="true"></div>
      <div id="dial" class="dial">
        <svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
          <circle class="dial-face" cx="100" cy="100" r="96"></circle>
          <g id="ticks"></g>
          <text class="card card-n" x="100" y="30">N</text>
          <text class="card" x="172" y="104">E</text>
          <text class="card" x="100" y="178">S</text>
          <text class="card" x="28" y="104">W</text>
          <!-- Qibla arrow: drawn pointing up, rotated to the Qibla bearing -->
          <g id="qibla-arrow" class="qibla-arrow" style="display:none">
            <line class="arrow-shaft" x1="100" y1="112" x2="100" y2="40"></line>
            <polygon class="arrow-head" points="100,26 88,50 112,50"></polygon>
            <g class="kaaba" transform="translate(100 13)">
              <rect x="-8" y="-8" width="16" height="16" rx="1.5"></rect>
              <rect class="kaaba-band" x="-8" y="-4" width="16" height="3"></rect>
            </g>
          </g>
          <circle class="hub" cx="100" cy="100" r="6"></circle>
        </svg>
      </div>
    </section>

    <p id="instruction" class="instruction" aria-live="polite">&nbsp;</p>
    <p id="details" class="details">&nbsp;</p>
    <p id="compass-hint" class="hint" style="display:none"></p>
    <form id="manual" class="search" autocomplete="off" style="display:none">
      <input id="search-input" type="search" placeholder="Type your city, e.g. Lahore" aria-label="Your city or address">
      <button class="btn" type="submit">Set</button>
    </form>
    <p id="hint" class="hint" style="display:none"></p>

    <div class="actions">
      <button id="btn-compass" class="btn btn-primary" type="button" style="display:none">Enable compass</button>
      <button id="btn-locate" class="btn" type="button">Update my location</button>
      <button id="btn-map" class="btn" type="button" aria-expanded="false">Show map</button>
    </div>

    <section id="map-panel" class="map-panel" style="display:none">
      <div id="map" class="map"></div>
      <p class="small">The green line is the shortest path to the Kaaba. Tap the map to move your location.</p>
    </section>

    <footer class="small">
      Hold your phone flat, away from metal and magnets.
      Map &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.
      Free &amp; open source.
    </footer>
  </main>

  <script src="js/qibla.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
